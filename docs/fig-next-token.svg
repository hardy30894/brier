<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="300" fill="#FFFFFF"/>
<text x="450" y="34" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">A language model computes one thing: a probability for every possible next token</text>
<rect x="60" y="70" width="38" height="30" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="79.0" y="90" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">The</text>
<rect x="104" y="70" width="70" height="30" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="139.0" y="90" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">ticket</text>
<rect x="180" y="70" width="70" height="30" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="215.0" y="90" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">should</text>
<rect x="256" y="70" width="38" height="30" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="275.0" y="90" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">go</text>
<rect x="300" y="70" width="38" height="30" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="319.0" y="90" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">to</text>
<rect x="344" y="70" width="46" height="30" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="367.0" y="90" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">the</text>
<rect x="396" y="70" width="60" height="30" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-dasharray="4 3"/>
<text x="426" y="90" font-size="15" font-weight="700" fill="#4F46E5" text-anchor="middle">?</text>
<text x="60" y="130" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">context (tokens so far)</text>
<line x1="426" y1="104" x2="426" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<text x="340" y="179" font-size="12" font-weight="400" fill="#0F172A" text-anchor="end">billing</text>
<rect x="350" y="168" width="300" height="14" rx="3" fill="#EEF0F3"/>
<rect x="350" y="168" width="126" height="14" rx="3" fill="#4F46E5"/>
<text x="660" y="179" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">0.42</text>
<text x="340" y="199" font-size="12" font-weight="400" fill="#0F172A" text-anchor="end">bug</text>
<rect x="350" y="188" width="300" height="14" rx="3" fill="#EEF0F3"/>
<rect x="350" y="188" width="93" height="14" rx="3" fill="#4F46E5"/>
<text x="660" y="199" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">0.31</text>
<text x="340" y="219" font-size="12" font-weight="400" fill="#0F172A" text-anchor="end">account</text>
<rect x="350" y="208" width="300" height="14" rx="3" fill="#EEF0F3"/>
<rect x="350" y="208" width="42" height="14" rx="3" fill="#4F46E5"/>
<text x="660" y="219" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">0.14</text>
<text x="340" y="239" font-size="12" font-weight="400" fill="#0F172A" text-anchor="end">other</text>
<rect x="350" y="228" width="300" height="14" rx="3" fill="#EEF0F3"/>
<rect x="350" y="228" width="18" height="14" rx="3" fill="#4F46E5"/>
<text x="660" y="239" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">0.06</text>
<text x="340" y="259" font-size="12" font-weight="400" fill="#0F172A" text-anchor="end">feature</text>
<rect x="350" y="248" width="300" height="14" rx="3" fill="#EEF0F3"/>
<rect x="350" y="248" width="12" height="14" rx="3" fill="#4F46E5"/>
<text x="660" y="259" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">0.04</text>
<text x="340" y="279" font-size="12" font-weight="400" fill="#8B93A1" text-anchor="end">…150,000 more</text>
<rect x="350" y="268" width="300" height="14" rx="3" fill="#EEF0F3"/>
<rect x="350" y="268" width="9" height="14" rx="3" fill="#8B93A1"/>
<text x="660" y="279" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">0.03</text>
<text x="720" y="190" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">This vector is the whole</text>
<text x="720" y="206" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">output of one forward pass.</text>
<text x="720" y="230" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">Generation = pick one, append,</text>
<text x="720" y="246" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">run the pass again. Brier never</text>
<text x="720" y="262" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">does the second step.</text>
</svg>