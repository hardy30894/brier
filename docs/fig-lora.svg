<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="260" fill="#FFFFFF"/>
<text x="450" y="34" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">LoRA: fine-tune a big matrix by adding a small low-rank one next to it</text>
<rect x="80" y="70" width="140" height="140" rx="3" fill="#F1F3F6" stroke="#E4E7EC"/>
<text x="150" y="145" font-size="22" font-weight="700" fill="#5B6472" text-anchor="middle">W</text>
<text x="150" y="230" font-size="10" font-weight="400" fill="#5B6472" text-anchor="middle">frozen, d × d (e.g. 2560 × 2560)</text>
<text x="260" y="145" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">+</text>
<rect x="310" y="70" width="140" height="22" rx="3" fill="#4F46E5"/>
<text x="380" y="86" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A  (r × d)</text>
<rect x="310" y="100" width="22" height="110" rx="3" fill="#4F46E5"/>
<text transform="translate(325 155) rotate(-90)" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">B (d × r)</text>
<text x="380" y="160" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="middle">trained</text>
<text x="380" y="178" font-size="11" font-weight="400" fill="#5B6472" text-anchor="middle">r = 16</text>
<text x="520" y="110" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">W' = W + B·A</text>
<text x="520" y="134" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">B·A has the same shape as W but only 2·d·r numbers</text>
<text x="520" y="150" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">to learn instead of d²: for d = 2560, r = 16 that is</text>
<text x="520" y="166" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">82k parameters per matrix instead of 6.5M (1.3%).</text>
<text x="520" y="194" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">The base model is untouched and can be restored by</text>
<text x="520" y="210" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">deleting the adapter. Fits a 4B model on one 24GB GPU.</text>
</svg>