<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="300" fill="#FFFFFF"/>
<text x="450" y="34" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Entropy: how spread out a distribution is. Confidence in Brier is the top probability; entropy is the fuller picture.</text>
<text x="160" y="76" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">certain</text>
<rect x="70" y="94" width="36" height="116" rx="3" fill="#4F46E5"/>
<rect x="116" y="209" width="36" height="1" rx="3" fill="#4F46E5"/>
<rect x="162" y="209" width="36" height="1" rx="3" fill="#4F46E5"/>
<rect x="208" y="209" width="36" height="1" rx="3" fill="#4F46E5"/>
<line x1="64" y1="210" x2="256" y2="210" stroke="#5B6472"/>
<text x="160" y="234" font-size="11" font-weight="400" fill="#5B6472" text-anchor="middle">top p = 0.97   H = 0.17 nats</text>
<text x="440" y="76" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">leaning</text>
<rect x="350" y="148" width="36" height="62" rx="3" fill="#4F46E5"/>
<rect x="396" y="169" width="36" height="41" rx="3" fill="#4F46E5"/>
<rect x="442" y="202" width="36" height="8" rx="3" fill="#4F46E5"/>
<rect x="488" y="202" width="36" height="8" rx="3" fill="#4F46E5"/>
<line x1="344" y1="210" x2="536" y2="210" stroke="#5B6472"/>
<text x="440" y="234" font-size="11" font-weight="400" fill="#5B6472" text-anchor="middle">top p = 0.52   H = 1.08 nats</text>
<text x="720" y="76" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">uniform</text>
<rect x="630" y="180" width="36" height="30" rx="3" fill="#4F46E5"/>
<rect x="676" y="180" width="36" height="30" rx="3" fill="#4F46E5"/>
<rect x="722" y="180" width="36" height="30" rx="3" fill="#4F46E5"/>
<rect x="768" y="180" width="36" height="30" rx="3" fill="#4F46E5"/>
<line x1="624" y1="210" x2="816" y2="210" stroke="#5B6472"/>
<text x="720" y="234" font-size="11" font-weight="400" fill="#5B6472" text-anchor="middle">top p = 0.25   H = 1.39 nats</text>
<text x="450" y="274" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="middle">H = −Σ p·log p. Zero when one outcome has all the mass; log(4) = 1.39 when four outcomes are equally likely.</text>
</svg>