<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="300" fill="#FFFFFF"/>
<text x="450" y="34" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">A probability distribution: one number per outcome, all non-negative, summing to one</text>
<rect x="70" y="219" width="90" height="11" rx="3" fill="#4F46E5"/>
<text x="115" y="250" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">billing</text>
<text x="115" y="210.8" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">0.07</text>
<rect x="220" y="176" width="90" height="54" rx="3" fill="#4F46E5"/>
<text x="265" y="250" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">bug</text>
<text x="265" y="167.6" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">0.34</text>
<rect x="370" y="230" width="90" height="0" rx="3" fill="#4F46E5"/>
<text x="415" y="250" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">feature</text>
<text x="415" y="222.0" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">0.00</text>
<rect x="520" y="147" width="90" height="83" rx="3" fill="#4F46E5"/>
<text x="565" y="250" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">account</text>
<text x="565" y="138.8" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">0.52</text>
<rect x="670" y="219" width="90" height="11" rx="3" fill="#4F46E5"/>
<text x="715" y="250" font-size="12" font-weight="400" fill="#0F172A" text-anchor="middle">other</text>
<text x="715" y="210.8" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">0.07</text>
<line x1="60" y1="230" x2="820" y2="230" stroke="#5B6472"/>
<text x="830" y="120" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Σ = 1.00</text>
<text x="450" y="282" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="middle">Reading it: 'account' is the most likely answer, but 'bug' has a third of the mass. The argmax hides that; the distribution shows it.</text>
</svg>