<text x="180.0" y="253.9076843471522" font-size="11" font-weight="700" fill="#8A2BE2" text-anchor="end">other</text>
<text x="190.0" y="264" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="middle">0.5</text>
<text x="285.0" y="264" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="middle">1</text>
<text x="380.0" y="264" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="middle">2</text>
<text x="475.0" y="264" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="middle">4</text>
<text x="570.0" y="264" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="middle">8</text>
<text x="142" y="253" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="end">0.0</text>
<text x="142" y="168.0" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="end">0.5</text>
<text x="142" y="83" font-size="10" font-weight="400" fill="#8A94A0" text-anchor="end">1.0</text>
<text x="700" y="110" font-size="12" font-weight="700" fill="#1B1F24" text-anchor="start">p_i = exp(s_i / T) / Σ_j exp(s_j / T)</text>
<text x="700" y="134" font-size="11" font-weight="400" fill="#5B6B7C" text-anchor="start">T → 0: all mass on the top score</text>
<text x="700" y="150" font-size="11" font-weight="400" fill="#5B6B7C" text-anchor="start">T = 1: the raw model distribution</text>
<text x="700" y="166" font-size="11" font-weight="400" fill="#5B6B7C" text-anchor="start">T → ∞: uniform</text>
<text x="700" y="196" font-size="11" font-weight="400" fill="#5B6B7C" text-anchor="start">The order of the curves never</text>
<text x="700" y="211" font-size="11" font-weight="400" fill="#5B6B7C" text-anchor="start">crosses: the argmax is the same</text>
<text x="700" y="226" font-size="11" font-weight="400" fill="#5B6B7C" text-anchor="start">at every T.</text>
