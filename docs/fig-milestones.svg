<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="300" fill="#FFFFFF"/>
<text x="40" y="34" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5B6472" text-anchor="start">MILESTONES</text>
<line x1="110" y1="110" x2="790" y2="110" stroke="#E4E7EC" stroke-width="1"/>
<circle cx="110.0" cy="110" r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
<text x="110.0" y="92" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">M1</text>
<text x="110.0" y="140" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">zero training</text>
<text x="110.0" y="156" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle">vs generating JSON</text>
<text x="110.0" y="188" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">10–20× faster,</text>
<text x="110.0" y="202" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">same accuracy</text>
<circle cx="223.3" cy="110" r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
<text x="223.33333333333331" y="92" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Kit</text>
<text x="223.33333333333331" y="140" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">calibration kit</text>
<text x="223.33333333333331" y="156" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle">thresholds from data</text>
<text x="223.33333333333331" y="188" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">ECE 0.37 → 0.16</text>
<text x="223.33333333333331" y="202" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">after one temperature</text>
<circle cx="336.7" cy="110" r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
<text x="336.66666666666663" y="92" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">M2 · r1</text>
<text x="336.66666666666663" y="140" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">train on labels</text>
<text x="336.66666666666663" y="156" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle">beats temperature?</text>
<text x="336.66666666666663" y="188" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">no: clean labels</text>
<text x="336.66666666666663" y="202" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">teach overconfidence</text>
<circle cx="450.0" cy="110" r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
<text x="450.0" y="92" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">M2 · r2</text>
<text x="450.0" y="140" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">ambiguity, hold-out</text>
<text x="450.0" y="156" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle">gate on unseen tasks</text>
<text x="450.0" y="188" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">4B passes:</text>
<text x="450.0" y="202" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">ECE 0.54 → 0.25</text>
<circle cx="563.3" cy="110" r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
<text x="563.3333333333333" y="92" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">r3</text>
<text x="563.3333333333333" y="140" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">contrastive, head</text>
<text x="563.3333333333333" y="156" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle">cure the shortcut</text>
<text x="563.3333333333333" y="188" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">0.6B duplicates</text>
<text x="563.3333333333333" y="202" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">0.64 → 0.97</text>
<circle cx="676.7" cy="110" r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
<text x="676.6666666666666" y="92" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">M3</text>
<text x="676.6666666666666" y="140" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">the demo</text>
<text x="676.6666666666666" y="156" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle">watch it decide</text>
<text x="676.6666666666666" y="188" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">replay of recorded</text>
<text x="676.6666666666666" y="202" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle">games, live next</text>
<circle cx="790.0" cy="110" r="7" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="790.0" y="92" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">next</text>
<text x="790.0" y="140" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">live demo, real data</text>
<text x="790.0" y="156" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle">head without LM term</text>
<text x="790.0" y="188" font-size="10" font-weight="400" fill="#8B93A1" text-anchor="middle"></text>
<line x1="40" y1="232" x2="860" y2="232" stroke="#E4E7EC" stroke-width="1"/>
<text x="40" y="256" font-size="10.5" font-weight="400" fill="#5B6472" text-anchor="start">Each stage asked one question and was judged by one held-out number. Where the number said no, the next stage changed the data, not the objective.</text>
<text x="40" y="274" font-size="10.5" font-weight="400" fill="#8B93A1" text-anchor="start">Details and every table: MILESTONES.md and TRAINING.md.</text>
</svg>