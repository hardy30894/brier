<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="450" y="34" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Calibration: when the model says 0.9, is it right 90% of the time?</text>
<line x1="80" y1="300" x2="320" y2="300" stroke="#5B6472"/>
<line x1="80" y1="300" x2="80" y2="60" stroke="#5B6472"/>
<line x1="80" y1="300" x2="320" y2="60" stroke="#8B93A1" stroke-dasharray="4 4"/>
<text x="200.0" y="330" font-size="11" font-weight="400" fill="#5B6472" text-anchor="middle">confidence the model reported</text>
<text transform="translate(50 180.0) rotate(-90)" font-size="11" fill="#5B6472" text-anchor="middle">fraction actually correct</text>
<text x="80" y="314" font-size="10" font-weight="400" fill="#8B93A1" text-anchor="middle">0.0</text>
<text x="72" y="304" font-size="10" font-weight="400" fill="#8B93A1" text-anchor="end">0.0</text>
<text x="200.0" y="314" font-size="10" font-weight="400" fill="#8B93A1" text-anchor="middle">0.5</text>
<text x="72" y="184.0" font-size="10" font-weight="400" fill="#8B93A1" text-anchor="end">0.5</text>
<text x="320" y="314" font-size="10" font-weight="400" fill="#8B93A1" text-anchor="middle">1.0</text>
<text x="72" y="64" font-size="10" font-weight="400" fill="#8B93A1" text-anchor="end">1.0</text>
<path d="M212 228 L236 214 L260 199 L284 180 L308 158 L318 149" fill="none" stroke="#B45309" stroke-width="2.5"/>
<circle cx="212" cy="228" r="4" fill="#B45309"/>
<circle cx="236" cy="214" r="4" fill="#B45309"/>
<circle cx="260" cy="199" r="4" fill="#B45309"/>
<circle cx="284" cy="180" r="4" fill="#B45309"/>
<circle cx="308" cy="158" r="4" fill="#B45309"/>
<circle cx="318" cy="149" r="4" fill="#B45309"/>
<path d="M164 221 L188 194 L212 173 L236 142 L260 125 L284 98" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
<circle cx="164" cy="221" r="4" fill="#4F46E5"/>
<circle cx="188" cy="194" r="4" fill="#4F46E5"/>
<circle cx="212" cy="173" r="4" fill="#4F46E5"/>
<circle cx="236" cy="142" r="4" fill="#4F46E5"/>
<circle cx="260" cy="125" r="4" fill="#4F46E5"/>
<circle cx="284" cy="98" r="4" fill="#4F46E5"/>
<text x="380" y="90" font-size="12" font-weight="400" fill="#8B93A1" text-anchor="start">dashed diagonal: perfect calibration</text>
<text x="380" y="120" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">raw log-likelihood confidence</text>
<text x="380" y="136" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Qwen3-4B on tickets reports a mean confidence of 0.95</text>
<text x="380" y="151" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">while being right 59% of the time. Points sit far below</text>
<text x="380" y="166" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">the diagonal: overconfident. ECE = 0.37.</text>
<text x="380" y="196" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="start">after one temperature per field</text>
<text x="380" y="212" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Scores are divided by a constant fitted on held-out data.</text>
<text x="380" y="227" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Rankings do not change, so accuracy is untouched, but the</text>
<text x="380" y="242" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">confidences move toward the diagonal. ECE = 0.16.</text>
<text x="380" y="272" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">ECE (expected calibration error) is the average gap</text>
<text x="380" y="287" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">between the two axes, weighted by how many decisions</text>
<text x="380" y="302" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">land in each confidence bin. Zero is perfect.</text>
</svg>