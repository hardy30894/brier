<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="40" y="34" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5B6472" text-anchor="start">METHOD</text>
<text x="40" y="58" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">One forward pass scores every allowed answer to every question</text>
<text x="40" y="78" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start">No text is generated. A value outside the allowed set cannot occur.</text>
<text x="40" y="120" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5B6472" text-anchor="start">STATE + QUESTIONS</text>
<text x="40" y="142" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">“Webhooks fire twice since 3am.</text>
<text x="40" y="160" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Need this today.”</text>
<text x="40" y="196" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">category</text>
<text x="40" y="211" font-size="10.5" font-weight="400" fill="#5B6472" text-anchor="start">billing · bug · feature · account · other</text>
<text x="40" y="236" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">priority</text>
<text x="40" y="251" font-size="10.5" font-weight="400" fill="#5B6472" text-anchor="start">low · medium · high · urgent</text>
<text x="40" y="276" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">needs_human</text>
<text x="40" y="291" font-size="10.5" font-weight="400" fill="#5B6472" text-anchor="start">yes · no</text>
<text x="330" y="120" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5B6472" text-anchor="start">BATCHED CANDIDATES</text>
