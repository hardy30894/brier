<line x1="330" y1="284" x2="460" y2="284" stroke="#E4E7EC" stroke-width="1"/>
<rect x="426" y="279" width="34" height="10" rx="2" fill="#4F46E5" opacity="0.35"/>
<text x="330" y="311" font-size="10.5" font-weight="400" fill="#5B6472" text-anchor="start">11 rows · identical prompt · one candidate tail each</text>
<line x1="470" y1="213.5" x2="516" y2="213.5" stroke="#5B6472" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="526" y="150" width="112" height="110" fill="none" stroke="#0F172A" stroke-width="1.4"/>
<text x="582" y="196" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">forward</text>
<text x="582" y="214" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">pass</text>
<text x="582" y="238" font-size="10" font-weight="400" fill="#5B6472" text-anchor="middle">log P(answer | state)</text>
<line x1="644" y1="205" x2="690" y2="205" stroke="#5B6472" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="700" y="120" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5B6472" text-anchor="start">DISTRIBUTIONS</text>
<text x="700" y="140" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">category</text>
<path d="M700 148 H799.2 a4 4 0 0 1 4 4 V152 a4 4 0 0 1 -4 4 H700 Z" fill="#4F46E5"/>
<text x="828" y="156" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">bug  0.86</text>
