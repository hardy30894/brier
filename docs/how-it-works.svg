<text x="828" y="251" font-size="10.5" font-weight="400" fill="#5B6472" text-anchor="start">medium  0.12</text>
<text x="700" y="270" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">needs_human</text>
<path d="M700 278 H808.8 a4 4 0 0 1 4 4 V282 a4 4 0 0 1 -4 4 H700 Z" fill="#4F46E5"/>
<text x="828" y="286" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">no  0.94</text>
<path d="M700 293 H703.6 a3.5999999999999996 3.5999999999999996 0 0 1 3.5999999999999996 3.5999999999999996 V297.4 a3.5999999999999996 3.5999999999999996 0 0 1 -3.5999999999999996 3.5999999999999996 H700 Z" fill="#E4E7EC"/>
<text x="828" y="301" font-size="10.5" font-weight="400" fill="#5B6472" text-anchor="start">yes  0.06</text>
<line x1="40" y1="340" x2="860" y2="340" stroke="#E4E7EC" stroke-width="1"/>
<text x="40" y="366" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Latency is one pass over a short batch; it grows with the number of allowed answers, not with output length.</text>
<text x="40" y="384" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Questions are scored independently in the same pass. The backbone is any open causal language model.</text>
</svg>