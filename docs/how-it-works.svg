<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5B6B7C"/></marker>
  </defs>
  <rect width="900" height="420" rx="14" fill="#FFFFFF" stroke="#D8DEE6"/>

  <text x="450" y="34" text-anchor="middle" font-size="15" fill="#5B6B7C">How a decision is made</text>

  <rect x="30" y="60" width="230" height="200" rx="10" fill="#F4F7FB" stroke="#C9D3E0"/>
  <text x="145" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1F24">input + schema</text>
  <text x="46" y="114" font-size="12" fill="#3A4652">"Webhooks fire twice since</text>
  <text x="46" y="130" font-size="12" fill="#3A4652">3am. Need this today."</text>
  <text x="46" y="162" font-size="12" font-weight="700" fill="#3557C4">category</text>
  <text x="46" y="178" font-size="11" fill="#5B6B7C">billing · bug · feature · account · other</text>
  <text x="46" y="202" font-size="12" font-weight="700" fill="#3557C4">priority</text>
  <text x="46" y="218" font-size="11" fill="#5B6B7C">low · medium · high · urgent</text>
  <text x="46" y="242" font-size="12" font-weight="700" fill="#3557C4">needs_human</text>
  <text x="46" y="258" font-size="11" fill="#5B6B7C">yes · no</text>

  <line x1="262" y1="160" x2="318" y2="160" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="322" y="60" width="256" height="200" rx="10" fill="#EEF3FF" stroke="#9DB9F5"/>
  <text x="450" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1F24">one batched forward pass</text>
  <text x="450" y="106" text-anchor="middle" font-size="11" fill="#5B6B7C">every allowed value of every field, scored at once</text>
  <g font-size="11" fill="#3A4652">
    <rect x="340" y="120" width="220" height="16" rx="3" fill="#FFFFFF" stroke="#C9D3E0"/><text x="348" y="132">…{"category": "billing</text>
    <rect x="340" y="140" width="220" height="16" rx="3" fill="#FFFFFF" stroke="#C9D3E0"/><text x="348" y="152">…{"category": "bug</text>
    <rect x="340" y="160" width="220" height="16" rx="3" fill="#FFFFFF" stroke="#C9D3E0"/><text x="348" y="172">…{"category": "feature</text>
    <text x="450" y="192" text-anchor="middle" fill="#5B6B7C">⋮</text>
    <rect x="340" y="200" width="220" height="16" rx="3" fill="#FFFFFF" stroke="#C9D3E0"/><text x="348" y="212">…{"needs_human": "yes</text>
    <rect x="340" y="220" width="220" height="16" rx="3" fill="#FFFFFF" stroke="#C9D3E0"/><text x="348" y="232">…{"needs_human": "no</text>
  </g>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#5B6B7C">log-probability of each value → softmax per field</text>

  <line x1="580" y1="160" x2="636" y2="160" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="640" y="60" width="230" height="200" rx="10" fill="#F4F7FB" stroke="#C9D3E0"/>
  <text x="755" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1F24">typed decision</text>
  <g font-size="12">
    <text x="656" y="118" font-weight="700" fill="#1B1F24">category</text>
    <rect x="656" y="124" width="200" height="8" rx="4" fill="#E3E8EF"/><rect x="656" y="124" width="172" height="8" rx="4" fill="#3557C4"/>
    <text x="656" y="146" fill="#3A4652">bug</text><text x="856" y="146" text-anchor="end" fill="#3557C4" font-weight="700">0.86</text>
    <text x="656" y="172" font-weight="700" fill="#1B1F24">priority</text>
    <rect x="656" y="178" width="200" height="8" rx="4" fill="#E3E8EF"/><rect x="656" y="178" width="118" height="8" rx="4" fill="#3557C4"/>
    <text x="656" y="200" fill="#3A4652">high</text><text x="856" y="200" text-anchor="end" fill="#3557C4" font-weight="700">0.59</text>
    <text x="656" y="226" font-weight="700" fill="#1B1F24">needs_human</text>
    <rect x="656" y="232" width="200" height="8" rx="4" fill="#E3E8EF"/><rect x="656" y="232" width="188" height="8" rx="4" fill="#3557C4"/>
    <text x="656" y="254" fill="#3A4652">no</text><text x="856" y="254" text-anchor="end" fill="#3557C4" font-weight="700">0.94</text>
  </g>

  <line x1="30" y1="290" x2="870" y2="290" stroke="#E3E8EF"/>
  <text x="46" y="318" font-size="12" font-weight="700" fill="#8A2BE2">generate JSON</text>
  <g font-size="11" fill="#5B6B7C">
    <text x="160" y="318">token → token → token → … → token → parse → validate → maybe a type error → maybe a retry</text>
  </g>
  <text x="46" y="352" font-size="12" font-weight="700" fill="#3557C4">Brier</text>
  <g font-size="11" fill="#3A4652">
    <text x="160" y="352">one pass → every field with a probability → cannot be malformed, because the model only chooses among allowed values</text>
  </g>
  <text x="450" y="392" text-anchor="middle" font-size="11" fill="#8A94A0">Fields are scored independently in the same pass. The backbone is any open causal LM; nothing is trained yet.</text>
</svg>