<text x="501.0" y="282" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">no</text>
<rect x="520" y="270" width="80" height="16" rx="3" fill="#F1F3F6"/>
<text x="560.0" y="282" font-size="9" font-weight="400" fill="#8B93A1" text-anchor="middle">pad</text>
<text x="620" y="72" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Only the candidate positions are read</text>
<text x="620" y="90" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">The model produces a next-token</text>
<text x="620" y="105" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">distribution at every position, but</text>
<text x="620" y="120" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Brier looks up just the candidate</text>
<text x="620" y="135" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">tokens' log-probabilities. That keeps</text>
<text x="620" y="150" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">memory small (the vocabulary is 150k).</text>
<text x="620" y="182" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Rows are padded to equal length with</text>
<text x="620" y="197" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">an attention mask, so padding is</text>
<text x="620" y="212" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">invisible to the model.</text>
<text x="620" y="244" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="start">11 rows, one call, ~100 ms on a 4090</text>
<text x="620" y="262" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">for a 4B model. The cost grows with</text>
<text x="620" y="277" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">the number of allowed values, not</text>
<text x="620" y="292" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">with output length.</text>
</svg>