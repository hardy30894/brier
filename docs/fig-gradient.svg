<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="280" fill="#FFFFFF"/>
<text x="450" y="34" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Training is one loop: score, compare to the label, nudge the weights downhill, repeat</text>
<rect x="30" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="94" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">example</text>
<text x="94" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">state, questions, labels</text>
<line x1="159" y1="106" x2="172" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="173" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="237" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">forward pass</text>
<text x="237" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">scores per candidate</text>
<line x1="302" y1="106" x2="315" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="316" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="380" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">softmax per question</text>
<text x="380" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">probabilities</text>
<line x1="445" y1="106" x2="458" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="459" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="523" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">loss</text>
<text x="523" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">−log p(correct answer)</text>
<line x1="588" y1="106" x2="601" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="602" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="666" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">backward pass</text>
<text x="666" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">gradient w.r.t. LoRA weights</text>
<line x1="731" y1="106" x2="744" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="745" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="809" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">optimizer step</text>
<text x="809" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">weights −= lr · gradient</text>
<path d="M 830 150 C 830 190, 100 190, 94 150" fill="none" stroke="#5B6472" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text x="450" y="198" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="middle">1500 steps × 4 examples each, about fifteen minutes for a 0.6B model on a 4090</text>
<text x="30" y="236" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">The loss is the log scoring rule from Part III of the architecture doc. Minimising it makes the correct answer likely AND makes the</text>
<text x="30" y="252" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">stated probabilities honest, because a proper scoring rule cannot be minimised by overclaiming.</text>
</svg>