<text x="60" y="214" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">probability = softmax(score / T). T is chosen to minimise negative log-likelihood on half the data and evaluated on the other half.</text>
<text x="60" y="230" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">The argmax never changes, so accuracy is identical at every T. Only honesty changes.</text>
