<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="450" y="34" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Inside the backbone: what one forward pass does to a sequence of tokens</text>
<rect x="30" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="94" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">tokens</text>
<text x="94" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">ids from the tokenizer</text>
<line x1="159" y1="106" x2="172" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="173" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="237" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">embeddings</text>
<text x="237" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">each id → a vector</text>
<line x1="302" y1="106" x2="315" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="316" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="380" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">N × blocks</text>
<text x="380" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">attention, then MLP</text>
<line x1="445" y1="106" x2="458" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="459" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="523" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">hidden states</text>
<text x="523" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">one vector per position</text>
<line x1="588" y1="106" x2="601" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="602" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="666" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">LM head</text>
<text x="666" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">vector → 150k logits</text>
<line x1="731" y1="106" x2="744" y2="106" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="745" y="70" width="128" height="72" rx="3" fill="#FFFFFF" stroke="#4F46E5"/>
<text x="809" y="98" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">softmax</text>
<text x="809" y="118" font-size="9.5" font-weight="400" fill="#5B6472" text-anchor="middle">next-token distribution</text>
<text x="30" y="182" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Inside one block</text>
<text x="30" y="202" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">attention:  for each position, a weighted average of every earlier position's vector, weights = softmax(query · keyᵀ / √d).</text>
<text x="30" y="218" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">                   This is how 'account' at the end can look back at 'can't log in' at the start.</text>
<text x="30" y="240" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">MLP:  the same small two-layer network applied to every position independently.</text>
<text x="30" y="262" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Each block adds its result to its input (a residual connection), so N blocks refine the same vectors N times.</text>
<text x="30" y="292" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="start">Where Brier reads:</text>
<text x="30" y="312" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">today, the softmax output at the candidate positions (milestone 1 and 2). LoRA (milestone 2) adds small trainable matrices inside</text>
<text x="30" y="328" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">the attention and MLP weights, leaving the original weights frozen. A future typed head would read the hidden states directly.</text>
</svg>