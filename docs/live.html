<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F6F2; --bg-2:#F1F0EB; --bg-3:#E9E7E1; --line:#DAD8D0; --line-2:#C3C0B6;
    --fg:#111111; --fg-2:#4A4A46; --fg-3:#8A8983; --accent:#3F39B8; --accent-2:#3F39B8; --warn:#9A5B12; --ok:#1F6F3F; --bad:#A3261B;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; --sans:'IBM Plex Sans',-apple-system,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="dark"] { --bg:#111111; --bg-2:#161616; --bg-3:#1F1F1F; --line:#262626; --line-2:#383838; --fg:#EDECE8; --fg-2:#B5B3AC; --fg-3:#6F6E69; --accent:#8F88F0; --accent-2:#6C64E8; --warn:#D59A3F; --ok:#4CB877; --bad:#E36B5F; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  .mono { font-family:var(--mono); }
  .app { display:grid; grid-template-rows:44px 1fr; height:100vh; }
  /* bar */
  .bar { display:flex; align-items:center; gap:18px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--bg-2); font-size:12.5px; }
  .bar img { height:18px; }
  .bar .name { font-weight:600; letter-spacing:.2px; }
  .bar .modes { display:flex; gap:2px; margin-left:8px; }
  .bar .modes button { padding:5px 10px; border-radius:6px; }
  .bar .modes button.on { background:var(--bg-3); color:var(--fg); }
  .bar .r { margin-left:auto; display:flex; align-items:center; gap:16px; color:var(--fg-2); font-family:var(--mono); font-size:12px; }
  .bar .r .lat { color:var(--fg); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--fg-3); display:inline-block; margin-right:6px; }
  .dot.on { background:var(--ok); }
  button { font:inherit; color:var(--fg-2); background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { color:var(--fg); background:var(--bg-3); }
  button.solid { background:var(--fg); color:var(--bg); }
  button.solid:hover { background:var(--fg-2); }
  button.ghost { border-color:var(--line-2); }
  button:disabled { opacity:.45; cursor:default; }
  /* workspace */
  .ws { display:grid; grid-template-columns:minmax(380px, 46%) 1fr; min-height:0; }
  .pane { min-width:0; min-height:0; display:flex; flex-direction:column; overflow:auto; }
  .pane + .pane { border-left:1px solid var(--line); }
  .ph { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); color:var(--fg-3); font-size:11px; letter-spacing:1.2px; text-transform:uppercase; font-weight:500; position:sticky; top:0; background:var(--bg); z-index:1; }
  .ph .sp { flex:1; }
  .ph .examples { display:flex; gap:2px; text-transform:none; letter-spacing:0; font-size:12px; }
  .ph .examples button { padding:3px 8px; }
  .ph .examples button.on { color:var(--fg); background:var(--bg-3); }
  textarea { width:100%; border:0; outline:0; resize:none; background:transparent; color:var(--fg); font:12.5px/1.65 var(--mono); padding:14px 16px; display:block; caret-color:var(--fg); }
  textarea::placeholder { color:var(--fg-3); }
  .ed { border-bottom:1px solid var(--line); }
  .ed.state textarea { min-height:190px; }
  .ed.questions textarea { min-height:150px; }
  .help { padding:6px 16px 12px; color:var(--fg-3); font-size:11.5px; font-family:var(--mono); border-bottom:1px solid var(--line); }
  .help b { color:var(--fg-2); font-weight:500; }
  .err { color:var(--bad); padding:8px 16px; font-family:var(--mono); font-size:12px; white-space:pre-wrap; }
  /* results */
  .res { padding:6px 0 0; }
  .q { padding:12px 16px 10px; border-bottom:1px solid var(--line); }
  .q .h { display:flex; align-items:baseline; gap:12px; margin-bottom:8px; font-family:var(--mono); font-size:12.5px; }
  .q .h .id { color:var(--fg); font-weight:500; }
  .q .h .kind { color:var(--fg-3); }
  .q .h .val { color:var(--fg); font-weight:500; }
  .q .h .tier { margin-left:auto; font-size:11px; letter-spacing:.6px; text-transform:uppercase; }
  .q .h .tier.auto { color:var(--ok); } .q .h .tier.review { color:var(--warn); } .q .h .tier.human { color:var(--fg-3); } .q .h .tier.none { color:var(--fg-3); }
  .row { display:grid; grid-template-columns:120px 1fr 52px; gap:12px; align-items:center; height:20px; font-family:var(--mono); font-size:12px; }
  .row .lab { color:var(--fg-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .tr { height:6px; background:var(--bg-3); border-radius:2px; overflow:hidden; }
  .row .fl { height:100%; width:0; background:var(--line-2); border-radius:2px; transition:width .35s cubic-bezier(.2,.8,.2,1), background .2s; }
  .row.top .fl { background:var(--accent); }
  .row.top .lab { color:var(--fg); }
  .row .pc { text-align:right; color:var(--fg-3); font-variant-numeric:tabular-nums; }
  .row.top .pc { color:var(--fg); }
  .log { font-family:var(--mono); font-size:11.5px; color:var(--fg-3); }
  .log .ln { display:grid; grid-template-columns:58px 64px 1fr 70px; gap:10px; padding:5px 16px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; }
  .log .ln .t { color:var(--fg-3); } .log .ln .ms { color:var(--fg-2); text-align:right; } .log .ln .a { color:var(--fg-2); overflow:hidden; text-overflow:ellipsis; }
  .log .ln.new { animation:fade .5s ease; } @keyframes fade { from { background:var(--bg-3) } to { background:transparent } }
  /* gridworld */
  .gw { display:grid; grid-template-columns:auto 1fr; gap:0; min-height:0; }
  .board { padding:24px; border-right:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(5,58px); gap:4px; }
  .cell { width:58px; height:58px; border-radius:4px; background:var(--bg-3); position:relative; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; color:var(--fg-2); transition:background .2s; }
  .cell.wall { background:var(--line-2); }
  .cell.exit { box-shadow:inset 0 0 0 1px var(--ok); color:var(--ok); }
  .cell.monster { box-shadow:inset 0 0 0 1px var(--bad); color:var(--bad); }
  .cell.trail { box-shadow:inset 0 0 0 1px var(--line-2); }
  .cell.player { background:var(--fg); color:var(--bg); }
  .cell.player.dead { background:var(--bad); } .cell.player.won { background:var(--ok); }
  .cell .arrow { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; color:var(--fg); opacity:0; transition:opacity .2s; }
  .cell .arrow.show { opacity:1; }
  .gctl { display:flex; gap:4px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  .gctl .sp { flex:1; }
  .gctl label { color:var(--fg-3); font-size:12px; display:flex; align-items:center; gap:8px; }
  input[type=range] { width:100px; accent-color:var(--accent); }
  .gstat { display:grid; grid-template-columns:repeat(4, 1fr); border-bottom:1px solid var(--line); }
  .gstat div { padding:10px 16px; border-right:1px solid var(--line); font-family:var(--mono); font-size:11.5px; color:var(--fg-3); }
  .gstat div:last-child { border-right:0; }
  .gstat b { display:block; font-size:18px; font-weight:500; color:var(--fg); }
  .gbars { padding:12px 16px; border-bottom:1px solid var(--line); }
  .hidden { display:none !important; }
  @media (max-width: 860px) { .ws { grid-template-columns:1fr; } .pane + .pane { border-left:0; border-top:1px solid var(--line); } .gw { grid-template-columns:1fr; } .board { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <img id="mark" src="/static/brier-mark.png" alt="">
    <span class="name">Brier</span>
    <div class="modes"><button id="m-decide" class="on">Decide</button><button id="m-play">Gridworld</button></div>
    <div class="r"><span><span class="dot" id="dot"></span><span id="model">connecting</span></span><span id="cal"></span><span class="lat" id="lat">–</span><button id="theme" title="theme">◐</button></div>
  </div>

  <div class="ws" id="decide">
    <div class="pane">
      <div class="ph">State<span class="sp"></span><div class="examples" id="examples"></div></div>
      <div class="ed state"><textarea id="state" spellcheck="false" placeholder="text, or JSON"></textarea></div>
      <div class="ph">Questions<span class="sp"></span><label style="text-transform:none;letter-spacing:0;font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="live" checked style="accent-color:var(--accent);margin:0"> live</label><button id="run" class="solid">Decide ⌘↩</button></div>
      <div class="ed questions"><textarea id="questions" spellcheck="false"></textarea></div>
      <div class="help">one per line · <b>id: choice</b> instructions <b>= a | b | c</b> · <b>id: score</b> instructions <b>= low &lt; high</b> · <b>id: claim</b> statement</div>
      <div class="err" id="err"></div>
    </div>
    <div class="pane">
      <div class="ph">Distributions<span class="sp"></span><span id="meta" style="text-transform:none;letter-spacing:0;font-family:var(--mono)"></span></div>
      <div class="res" id="res"></div>
      <div class="ph">Log</div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="ws gw hidden" id="play">
    <div class="board"><div class="grid" id="grid"></div></div>
    <div class="pane">
      <div class="gctl"><button id="newg" class="solid">New game</button><button id="stepg" class="ghost">Step</button><button id="playg" class="ghost">Auto</button><span class="sp"></span><label>speed <input type="range" id="speed" min="120" max="1200" value="650"></label></div>
      <div class="gstat"><div>won<b id="won">0</b></div><div>lost<b id="lost">0</b></div><div>moves<b id="moves">0</b></div><div>p50 ms<b id="glat">–</b></div></div>
      <div class="gbars" id="gbars"></div>
      <div class="ph">Moves</div>
      <div class="log" id="glog"></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const api = async (path, body) => { const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; };
const ms = x => x >= 1000 ? (x / 1000).toFixed(2) + " s" : x.toFixed(0) + " ms";
const now = () => new Date().toTimeString().slice(0, 8);

// theme
function setTheme(t) { document.documentElement.dataset.theme = t; $("mark").src = t === "light" ? "/static/brier-mark.png" : "/static/brier-mark-dark.png"; try { localStorage.setItem("brier-theme", t); } catch (e) {} }
let theme = "light"; try { theme = localStorage.getItem("brier-theme") || "light"; } catch (e) {} setTheme(theme);
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

// modes
$("m-decide").onclick = () => { $("decide").classList.remove("hidden"); $("play").classList.add("hidden"); $("m-decide").classList.add("on"); $("m-play").classList.remove("on"); };
$("m-play").onclick = () => { $("play").classList.remove("hidden"); $("decide").classList.add("hidden"); $("m-play").classList.add("on"); $("m-decide").classList.remove("on"); if (!game) newGame(); };

// ---- questions DSL ----
function parseQuestions(text) {
  const out = [], errs = [];
  text.split("\n").forEach((line, i) => {
    const l = line.trim(); if (!l || l.startsWith("#")) return;
    const m = l.match(/^([A-Za-z_][\w-]*)\s*:\s*(choice|score|claim)\b\s*(.*)$/);
    if (!m) { errs.push(`line ${i + 1}: expected "id: choice|score|claim …"`); return; }
    const [, id, kind, rest] = m;
    if (kind === "claim") { out.push({ kind, id, instructions: rest.trim() }); return; }
    const eq = rest.lastIndexOf("="); if (eq < 0) { errs.push(`line ${i + 1}: ${kind} needs "= options"`); return; }
    const instructions = rest.slice(0, eq).trim(); const optsRaw = rest.slice(eq + 1);
    const sep = kind === "score" ? /<|\|/ : /\|/;
    const opts = optsRaw.split(sep).map(s => s.trim()).filter(Boolean);
    if (opts.length < 2) { errs.push(`line ${i + 1}: need at least two options`); return; }
    out.push(kind === "score" ? { kind, id, instructions, levels: opts } : { kind, id, instructions, options: opts });
  });
  return { questions: out, errs };
}
const EX = {
  "ticket": { state: "Webhooks are firing twice for every event since around 3am UTC. I need this sorted today if at all possible. We're on the Team plan.",
    questions: "category: choice which team should handle this ticket = billing | bug | feature | account | other\npriority: score how fast this must be handled = low < medium < high < urgent\nneeds_human: claim the customer is asking for a human agent rather than an automated reply" },
  "tool": { state: JSON.stringify({ request: "send me the invoice for September and then cancel my plan", tools: { get_invoice: "Fetch a billing invoice by month", cancel_subscription: "Cancel the current subscription", reset_password: "Send a password reset email", schedule_call: "Book a call with a human agent", none: "No tool applies" } }, null, 2),
    questions: "tool: choice which tool should be called first = get_invoice | cancel_subscription | reset_password | schedule_call | none\ntwo_tools: claim the request needs more than one tool" },
  "records": { state: JSON.stringify({ record_a: { name: "Priya Raman", email: "priya.raman@northwind.io", phone: "+1 415 555 0142", company: "Northwind" }, record_b: { name: "P. Raman", email: "praman@northwind.io", company: "Northwind" } }, null, 2),
    questions: "same: claim the two records describe the same person" },
  "passage": { state: JSON.stringify({ question: "What is the refund window?", passage: "Customers may request a full refund within 30 days of purchase. The support team works in two shifts." }, null, 2),
    questions: "answers: claim the passage contains the information needed to answer the question\nrelevance: score how related the passage is to the question = unrelated < tangential < related < answers it" },
  "frustration": { state: "Third outage this month and nobody has replied to my two emails about the SSO settings you deleted. What exactly are we paying for?",
    questions: "frustration: score how frustrated the customer is = calm < annoyed < angry < furious\nchurn_risk: claim the customer is threatening to leave" },
};
Object.keys(EX).forEach((k, i) => { const b = document.createElement("button"); b.textContent = k; b.className = i === 0 ? "on" : ""; b.onclick = () => { $("state").value = EX[k].state; $("questions").value = EX[k].questions; [...$("examples").children].forEach(x => x.classList.toggle("on", x === b)); decide(); }; $("examples").appendChild(b); });
$("state").value = EX.ticket.state; $("questions").value = EX.ticket.questions;

// ---- results ----
function render(root, answers) {
  const seen = new Set();
  for (const a of answers) {
    seen.add(a.id);
    let el = root.querySelector(`[data-id="${CSS.escape(a.id)}"]`);
    if (!el) { el = document.createElement("div"); el.className = "q"; el.dataset.id = a.id; el.innerHTML = `<div class="h"><span class="id"></span><span class="kind"></span><span class="val"></span><span class="tier"></span></div><div class="rows"></div>`; root.appendChild(el); }
    el.querySelector(".id").textContent = a.id; el.querySelector(".kind").textContent = a.kind;
    el.querySelector(".val").textContent = a.kind === "claim" ? `p = ${a.value.toFixed(3)}` : (a.kind === "score" && a.expected != null ? `${a.value}  E[level] ${a.expected.toFixed(2)}` : a.value);
    const t = el.querySelector(".tier"); t.textContent = a.tier || "uncalibrated"; t.className = "tier " + (a.tier || "none");
    const rows = el.querySelector(".rows"); const order = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]); const top = order[0][0];
    for (const [lab, p] of order) {
      let r = rows.querySelector(`[data-lab="${CSS.escape(lab)}"]`);
      if (!r) { r = document.createElement("div"); r.className = "row"; r.dataset.lab = lab; r.innerHTML = `<span class="lab"></span><div class="tr"><div class="fl"></div></div><span class="pc"></span>`; rows.appendChild(r); }
      r.classList.toggle("top", lab === top); r.querySelector(".lab").textContent = lab; r.querySelector(".fl").style.width = (p * 100).toFixed(1) + "%"; r.querySelector(".pc").textContent = (p * 100).toFixed(1);
      rows.appendChild(r);
    }
    const keep = new Set(order.map(x => x[0])); [...rows.children].forEach(r => { if (!keep.has(r.dataset.lab)) r.remove(); });
  }
  [...root.children].forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
}
function logLine(root, cols, max = 40) {
  const d = document.createElement("div"); d.className = "ln new"; d.innerHTML = cols.map(([c, cls]) => `<span class="${cls}"></span>`).join("");
  [...d.children].forEach((s, i) => s.textContent = cols[i][0]);
  root.insertBefore(d, root.firstChild); while (root.children.length > max) root.lastChild.remove();
}
let seq = 0, timer = null, modelName = "";
async function decide() {
  const { questions, errs } = parseQuestions($("questions").value);
  $("err").textContent = errs.join("\n"); if (!questions.length) return;
  const my = ++seq; let state = $("state").value; try { state = JSON.parse(state); } catch (e) {}
  try {
    const r = await api("/ask", { state, questions });
    if (my !== seq) return;
    render($("res"), r.answers);
    const nc = r.answers.reduce((n, a) => n + Object.keys(a.probabilities).length, 0);
    $("lat").textContent = ms(r.latency_ms); $("meta").textContent = `${r.answers.length} q · ${nc} candidates · 1 pass · ${ms(r.latency_ms)}`;
    logLine($("log"), [[now(), "t"], [ms(r.latency_ms), "ms"], [r.answers.map(a => `${a.id}=${a.kind === "claim" ? a.value.toFixed(2) : a.value}`).join("  "), "a"], [`${nc} cand`, "ms"]]);
  } catch (e) { if (my === seq) $("err").textContent = e.message; }
}
function schedule() { if (!$("live").checked) return; clearTimeout(timer); timer = setTimeout(decide, 320); }
$("state").addEventListener("input", schedule); $("questions").addEventListener("input", schedule);
$("run").onclick = decide;
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); decide(); } });

// ---- gridworld ----
let game = null, gtimer = null, glats = [], won = 0, lost = 0, moves = 0, busy = false, trail = [];
const MOVES = ["up", "down", "left", "right"], DIRV = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }, GL = { up: "↑", down: "↓", left: "←", right: "→" };
function drawGrid(probs) {
  const g = $("grid");
  if (g.children.length !== 25) { g.innerHTML = ""; for (let i = 0; i < 25; i++) { const d = document.createElement("div"); d.className = "cell"; d.innerHTML = `<span class="t"></span><span class="arrow"></span>`; g.appendChild(d); } }
  if (!game) return;
  const [pr, pc] = game.player;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const ch = game.grid[r][c], d = g.children[r * 5 + c]; let cls = "cell", txt = "";
    if (ch === "#") cls += " wall";
    if (r === game.exit[0] && c === game.exit[1]) { cls += " exit"; txt = "E"; }
    if (r === game.monster[0] && c === game.monster[1]) { cls += " monster"; txt = "M"; }
    if (trail.some(([a, b]) => a === r && b === c) && !(r === pr && c === pc)) cls += " trail";
    if (r === pr && c === pc) { cls += " player" + (game.status === "dead" ? " dead" : game.status === "exit" ? " won" : ""); txt = "P"; }
    d.className = cls; d.querySelector(".t").textContent = txt; const ar = d.querySelector(".arrow"); ar.className = "arrow"; ar.textContent = "";
  }
  if (probs && game.status === "ok") for (const [m, [dr, dc]] of Object.entries(DIRV)) {
    const r = pr + dr, c = pc + dc; if (r < 0 || r > 4 || c < 0 || c > 4) continue;
    const ar = g.children[r * 5 + c].querySelector(".arrow"); ar.textContent = `${GL[m]}${(probs[m] * 100).toFixed(0)}`; ar.style.opacity = 0.35 + 0.65 * probs[m]; ar.classList.add("show");
  }
}
function drawBars(probs, move) {
  const b = $("gbars");
  if (b.children.length !== 4) { b.innerHTML = ""; for (const m of MOVES) { const r = document.createElement("div"); r.className = "row"; r.dataset.lab = m; r.innerHTML = `<span class="lab">${m}</span><div class="tr"><div class="fl"></div></div><span class="pc"></span>`; b.appendChild(r); } }
  for (const r of b.children) { const m = r.dataset.lab, p = probs ? probs[m] : 0; r.classList.toggle("top", m === move); r.querySelector(".fl").style.width = (p * 100).toFixed(1) + "%"; r.querySelector(".pc").textContent = probs ? (p * 100).toFixed(1) : ""; }
}
const p50 = () => { if (!glats.length) return "–"; const s = [...glats].sort((a, b) => a - b); return s[Math.floor(s.length / 2)].toFixed(0); };
async function newGame() { stopG(); game = await api("/grid/new", {}); trail = []; drawGrid(); drawBars(null); }
async function stepG() {
  if (!game || busy || game.status !== "ok") return; busy = true;
  try {
    const r = await api("/grid/step", { game });
    glats.push(r.latency_ms); if (glats.length > 200) glats.shift();
    drawBars(r.probabilities, r.move); drawGrid(r.probabilities);
    await new Promise(res => setTimeout(res, 300));
    trail.push(game.player); game = r.game; drawGrid(); moves++;
    $("moves").textContent = moves; $("glat").textContent = p50(); $("lat").textContent = ms(r.latency_ms);
    let note = r.optimal ? "optimal" : "not optimal";
    if (game.status === "exit") { won++; $("won").textContent = won; note += " · exit"; stopG(); }
    else if (game.status === "dead") { lost++; $("lost").textContent = lost; note += " · monster"; stopG(); }
    else if (game.steps >= 12) { lost++; $("lost").textContent = lost; note += " · out of moves"; game.status = "dead"; stopG(); }
    logLine($("glog"), [[now(), "t"], [ms(r.latency_ms), "ms"], [`${r.move} ${(r.probabilities[r.move] * 100).toFixed(0)}% · ${note}`, "a"], [`step ${game.steps}`, "ms"]]);
  } catch (e) { logLine($("glog"), [[now(), "t"], ["", "ms"], [e.message, "a"], ["", "ms"]]); stopG(); } finally { busy = false; }
}
function playG() { stopG(); $("playg").textContent = "Pause"; gtimer = setInterval(async () => { if (!game || game.status !== "ok") { game = await api("/grid/new", {}); trail = []; drawGrid(); } await stepG(); }, 1320 - +$("speed").value); }
function stopG() { if (gtimer) clearInterval(gtimer); gtimer = null; $("playg").textContent = "Auto"; }
$("newg").onclick = newGame; $("stepg").onclick = () => { stopG(); stepG(); }; $("playg").onclick = () => gtimer ? stopG() : playG(); $("speed").oninput = () => { if (gtimer) playG(); };

// ---- boot ----
(async () => {
  drawGrid(); drawBars(null);
  try { const h = await api("/health"); $("dot").classList.add("on"); modelName = h.mock ? "mock" : h.models.questions; $("model").textContent = modelName; $("cal").textContent = h.calibrated ? "calibrated" : "no calibration file"; }
  catch (e) { $("model").textContent = "server not reachable"; return; }
  decide();
  if (location.hash === "#gridworld") $("m-play").click();
})();
</script>
