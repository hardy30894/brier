<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B6472"/></marker></defs>
<rect width="900" height="420" fill="#FFFFFF"/>
<text x="450" y="34" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">How the backbone was trained (today) and how Brier will train on top of it (milestone 2)</text>
<rect x="40" y="60" width="255" height="96" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="54" y="84" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">pretraining</text>
<text x="54" y="104" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">objective: predict the next token</text>
<text x="54" y="120" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">data: trillions of tokens of text</text>
<text x="54" y="140" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">→ general knowledge, reading</text>
<line x1="297" y1="108" x2="313" y2="108" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="315" y="60" width="255" height="96" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="329" y="84" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">instruction tuning</text>
<text x="329" y="104" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">objective: imitate helpful answers</text>
<text x="329" y="120" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">data: curated prompt/response pairs</text>
<text x="329" y="140" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">→ follows instructions, JSON</text>
<line x1="572" y1="108" x2="588" y2="108" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="590" y="60" width="255" height="96" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="604" y="84" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">preference tuning</text>
<text x="604" y="104" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">objective: reward preferred answers</text>
<text x="604" y="120" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">data: human or model preferences</text>
<text x="604" y="140" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">→ confident, agreeable tone</text>
<text x="40" y="182" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">published open weights (e.g. Qwen3-4B). Milestone 1 uses them exactly as released: good at ranking values, bad at stating probabilities.</text>
<line x1="40" y1="200" x2="860" y2="200" stroke="#E4E7EC"/>
<rect x="40" y="220" width="200" height="170" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="54" y="244" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">data with ground truth</text>
<text x="54" y="266" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">synthetic environments</text>
<text x="54" y="282" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">(answer is computable)</text>
<text x="54" y="298" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">distilled labels from a</text>
<text x="54" y="314" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">frontier model, parsed to types</text>
<text x="54" y="330" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">logs from real software</text>
<text x="54" y="346" font-size="11" font-weight="400" fill="#8B93A1" text-anchor="start">with a checkable outcome</text>
<line x1="242" y1="305" x2="268" y2="305" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="270" y="220" width="220" height="170" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="284" y="244" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">backbone + typed heads</text>
<text x="284" y="266" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">the LM head is dropped</text>
<text x="284" y="282" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">one head per field type:</text>
<text x="284" y="298" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">enum → softmax over values</text>
<text x="284" y="314" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">bool → one logit</text>
<text x="284" y="330" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">number → bucketed distribution</text>
<text x="284" y="346" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">select → pointer over input</text>
<text x="284" y="370" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">LoRA on the backbone, heads full</text>
<line x1="492" y1="305" x2="518" y2="305" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="520" y="220" width="340" height="170" rx="3" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="534" y="244" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">objective: calibrated decisions</text>
<text x="534" y="266" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">1. cross-entropy on typed labels: a proper scoring</text>
<text x="534" y="281" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">   rule, minimised only by honest probabilities</text>
<text x="534" y="301" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">2. outcome reward on environments: Brier score of</text>
<text x="534" y="316" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">   the stated probability, penalising confident misses</text>
<text x="534" y="336" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">3. gate: ECE on held-out data must beat the</text>
<text x="534" y="351" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">   temperature-scaled milestone 1 number</text>
<text x="534" y="375" font-size="11" font-weight="400" fill="#4F46E5" text-anchor="start">no preference model, no pass/fail reward</text>
</svg>