[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brier-decisions"
version = "0.1.0"
description = "Calibrated typed decisions from any open language model, in one forward pass"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "hardy30894" }]
keywords = ["decisions", "calibration", "typed", "classification", "language-models", "encoders"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3",
  "transformers>=4.51",
  "peft>=0.12",
  "numpy>=1.24",
  "datasets>=2.19",
]

[project.optional-dependencies]
baselines = ["scikit-learn>=1.3"]
release = ["huggingface_hub>=0.23"]
dev = ["build", "twine", "scikit-learn>=1.3", "huggingface_hub>=0.23"]

[project.scripts]
brier = "brier.__main__:main"
brier-serve = "brier.serve:main"

[project.urls]
Homepage = "https://github.com/hardy30894/brier"
Documentation = "https://github.com/hardy30894/brier/tree/main/docs"
Source = "https://github.com/hardy30894/brier"
Issues = "https://github.com/hardy30894/brier/issues"

[tool.setuptools]
packages = ["brier", "tasks"]
include-package-data = false
